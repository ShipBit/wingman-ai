# Merge this server into your existing mcp.yaml; do not replace other servers.
# These absolute paths match this private checkout. Change them if it moves.
servers:
  - name: elite_public_data
    display_name: Elite Public Data
    description: Elite Dangerous Live systems, stations, nearby services, trade comparisons and ship engineering recipes. Community observations and versioned references with dates and source links.
    type: stdio
    command: C:/Projects/wingman-ai/.venv-elite/Scripts/python.exe
    args:
      - C:/Projects/wingman-ai/integrations/elite_dangerous/server.py
      - --cache-dir
      - C:/Projects/wingman-ai/.elite-local/cache
    timeout: 45
    discoverable_by_default: false
    discovery_keywords:
      - Elite Dangerous
      - system information
      - station services
      - refuel
      - repair
      - Vista Genomics
      - commodity prices
      - outfitting
      - trade comparison
      - nearby services
      - engineering recipes
      - material requirements
