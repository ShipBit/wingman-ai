module: skills.image_generation.main
name: ImageGeneration
api_version: 3
display_name: Image Generation
author: ShipBit
discoverable_by_default: false
tags:
  - Image
  - Internet
description:
  en: Use Wingman AI to generate images based on your input.
  de: Verwende Wingman AI, um Bilder basierend auf deinen Eingaben zu generieren.
discovery_keywords:
  - create image
  - generate picture
  - DALL-E
  - draw
  - make image
  - AI art
  - image creation
custom_properties:
  - hint: Whether generated images should be kept. They are always written to your WingmanAI APPDATA directory in a subdirectory called "generated_files" so the client can display them - with this off, only the 25 most recent ones are kept there.
    id: save_images
    name: Keep generated images
    property_type: boolean
    required: false
    value: false
