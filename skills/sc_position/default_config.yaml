module: skills.sc_position.main
name: ScPosition
api_version: 3
display_name: Star Citizen Position
author: ShipBit
auto_activate: true
tags:
  - Star Citizen
  - Game Integration
description:
  en: Reads your position in Star Citizen through the game's /showlocation chat command and tells you the body, your height above it, the nearest known place, and distance and bearing to waypoints you saved. Stanton only, so far. Say where you are once per body to calibrate its rotation.
  de: Liest deine Position in Star Citizen über den Chat-Befehl /showlocation des Spiels und sagt dir Himmelskörper, Höhe, den nächsten bekannten Ort und Entfernung und Richtung zu gespeicherten Wegpunkten. Bisher nur Stanton. Sag einmal pro Himmelskörper, wo du bist, um seine Rotation zu kalibrieren.
discovery_keywords:
  - where am i
  - my position
  - coordinates
  - location
  - waypoint
  - how far
  - am i there yet
  - save this place
  - mark this spot
custom_properties:
  - id: chat_hidden
    name: Chat is hidden
    hint: On when you play with the chat window hidden (F12), which most players do. The skill then shows the chat for the command and hides it again. Off when your chat is visible. A wrong setting sends the keys into the game instead of the chat (Ctrl is crouch), so set it the way you play.
    value: true
    required: false
    property_type: boolean
  - id: chat_toggle_key
    name: Chat toggle key
    hint: The game's key that shows and hides the chat window. Used when "Chat is hidden" is on.
    value: f12
    required: false
    property_type: string
  - id: chat_input_key
    name: Chat input key
    hint: The key that puts the cursor into the chat and sends a line.
    value: enter
    required: false
    property_type: string
  - id: paste_key
    name: Paste key
    hint: Pastes the command into the chat. The command is pasted, not typed, so no stray letters reach the game when the chat has no focus.
    value: ctrl+v
    required: false
    property_type: string
  - id: key_delay_ms
    name: Delay between keys (ms)
    hint: Raise it when the game misses keys. 50 to 1000.
    value: 150
    required: false
    property_type: number
  - id: tolerance_m
    name: Waypoint tolerance (m)
    hint: This close to a waypoint counts as arrived, unless the waypoint has its own. Planets turn, so a second of clock error moves a surface point by a few hundred metres; stay at 500 or more.
    value: 1000
    required: false
    property_type: number
  - id: place_radius_km
    name: Place radius (km)
    hint: This close to a known place you are "at" it, and the skill says so without a distance. A place is one point in the data, but a station or a city is kilometres across, and the rotation model leaves a kilometre or two even when calibrated. Up to five times this radius you are "near" it.
    value: 5
    required: false
    property_type: number
  - id: show_in_hud
    name: Show in HUD
    hint: Show each reading as a HUD message when the HUD is on.
    value: true
    required: false
    property_type: boolean
