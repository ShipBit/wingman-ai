module: skills.sc_game_events.main
name: ScGameEvents
api_version: 3
display_name: Star Citizen Events
author: Mallachi
requires:
  - sc_gamelog
auto_activate: true
tags:
  - Star Citizen
  - Game Integration
description:
  en: Your Wingman reacts in character to what happens in Star Citizen, like missions, zones, trades, shields, hits and quantum jumps, and knows where you are, your missions and the state of your ship. Needs the Star Citizen log in the settings, and Star Citizen telemetry for the ship and the pilot.
  de: Dein Wingman reagiert in seiner Rolle auf das, was in Star Citizen passiert, etwa Missionen, Zonen, Handel, Schilde, Treffer und Quantensprünge, und weiß, wo du bist, welche Missionen du hast und wie es deinem Schiff geht. Braucht das Star Citizen Log in den Einstellungen und für Schiff und Pilot die Star Citizen Telemetrie.
# A production build does not offer telemetry yet (services/features.py).
unreleased:
  sc_telemetry:
    description:
      en: Your Wingman reacts in character to what happens in Star Citizen, like missions, zones, trades and quantum travel, and knows where you are and your missions. Needs the Star Citizen log in the settings.
      de: Dein Wingman reagiert in seiner Rolle auf das, was in Star Citizen passiert, etwa Missionen, Zonen, Handel und Quantenreisen, und weiß, wo du bist und welche Missionen du hast. Braucht das Star Citizen Log in den Einstellungen.
discovery_keywords:
  - star citizen
  - game events
  - mission
  - location
  - where am i
  - ship status
  - shields
  - health
property_groups:
  - id: missions
    name: Missions
    toggle: react_mission
  - id: safety
    name: Zones and safety
    toggle: react_safety
  - id: health
    name: Health
    toggle: react_health
  - id: ship
    name: Ship and hangar
    toggle: react_ship
  - id: money
    name: Trade and rewards
    toggle: react_money
  - id: location
    hint: These come often.
    name: Location and quantum travel
    toggle: react_location
  - id: session
    name: Session and social
    toggle: react_session
  - id: combat
    feature: sc_telemetry
    hint: Needs Star Citizen telemetry in the settings.
    name: Combat
    toggle: react_telemetry_combat
  - id: ship_alerts
    feature: sc_telemetry
    hint: Needs Star Citizen telemetry in the settings.
    name: Ship alerts
    toggle: react_telemetry_ship_alerts
  - id: flight
    feature: sc_telemetry
    hint: Needs Star Citizen telemetry in the settings. These come on every flight.
    name: Flight and travel
    toggle: react_telemetry_flight
  - id: survival
    feature: sc_telemetry
    hint: Needs Star Citizen telemetry in the settings.
    name: Survival
    toggle: react_telemetry_survival
  - id: body
    feature: sc_telemetry
    hint: Needs Star Citizen telemetry in the settings.
    name: Body needs
    toggle: react_telemetry_body
  - id: wallet
    feature: sc_telemetry
    hint: Needs Star Citizen telemetry in the settings. Only speaks when purchases, sales and rewards come from the telemetry (see Game log or telemetry).
    name: Wallet
    toggle: react_telemetry_wallet
  - id: sources
    feature: sc_telemetry
    name: Game log or telemetry
    hint: Both see these events. Pick which one speaks. If the one you pick is off, the other one speaks.
