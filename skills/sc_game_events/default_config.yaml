module: skills.sc_game_events.main
name: ScGameEvents
api_version: 3
display_name: Star Citizen Events
author: Mallachi
requires:
  - sc_gamelog
auto_activate: true
tags:
  - Star Citizen
  - Game Integration
description:
  en: Your Wingman reacts in character to what happens in Star Citizen, like missions, zones, trades, shields, hits and quantum jumps, and knows where you are, your missions and the state of your ship. Needs the Star Citizen log in the settings, and Star Citizen telemetry for the ship and the pilot.
  de: Dein Wingman reagiert in seiner Rolle auf das, was in Star Citizen passiert, etwa Missionen, Zonen, Handel, Schilde, Treffer und Quantensprünge, und weiß, wo du bist, welche Missionen du hast und wie es deinem Schiff geht. Braucht das Star Citizen Log in den Einstellungen und für Schiff und Pilot die Star Citizen Telemetrie.
discovery_keywords:
  - star citizen
  - game events
  - mission
  - location
  - where am i
  - ship status
  - shields
  - health
