  - id: source_money
    name: Purchases, sales and rewards from
    hint: Game log and telemetry both see this. Pick which one speaks. If the one you pick is off, the other one speaks.
    property_type: single_select
    required: false
    value: log
    options:
      - label: Game log (item and amount)
        value: log
      - label: Telemetry (wallet balance)
        value: telemetry
  - id: source_boarding
    name: Boarding a ship from
    hint: Game log and telemetry both see this. Pick which one speaks. If the one you pick is off, the other one speaks.
    property_type: single_select
    required: false
    value: log
    options:
      - label: Game log (every boarding)
        value: log
      - label: Telemetry (ship changes only)
        value: telemetry
  - id: source_fuel
    name: Low fuel from
    hint: Game log and telemetry both see this. Pick which one speaks. If the one you pick is off, the other one speaks.
    property_type: single_select
    required: false
    value: log
    options:
      - label: Game log (the game's warning)
        value: log
      - label: Telemetry (hydrogen in percent)
        value: telemetry
  - id: source_quantum_arrival
    name: Quantum arrival from
    hint: Game log and telemetry both see this. Pick which one speaks. If the one you pick is off, the other one speaks.
    property_type: single_select
    required: false
    value: telemetry
    options:
      - label: Game log (arrival)
        value: log
      - label: Telemetry (jump start and end)
        value: telemetry
  - id: source_down
    name: Pilot down from
    hint: Game log and telemetry both see this. Pick which one speaks. If the one you pick is off, the other one speaks.
    property_type: single_select
    required: false
    value: telemetry
    options:
      - label: Game log (incapacitated)
        value: log
      - label: Telemetry (down and respawn)
        value: telemetry
  - id: max_unanswered
    name: Reactions until you speak again
    hint: The Wingman stops reacting after this many reactions until you say or type something. 0 means no limit.
    property_type: number
    required: false
    value: 10
  - id: routine_gap_minutes
    name: Minutes between routine lines
    hint: Zones, quantum travel, the hangar and the login are said at most once in this many minutes, per group. Arrivals, departures, missions, money and injuries are not held back by this.
    property_type: slider
    options:
      - label: "min"
        value: 2
      - label: "max"
        value: 20
      - label: "step"
        value: 1
    required: false
    value: 5
  - id: show_in_hud
    name: Show reactions in the HUD
    hint: Also show what the Wingman says about the game in the HUD overlay, if the HUD is switched on in the settings.
    property_type: boolean
    required: false
    value: true
  - id: remember_reactions
    name: Remember reactions
    hint: Keep what the Wingman said about the game in the conversation, so it can refer back to it.
    property_type: boolean
    required: false
    value: true
