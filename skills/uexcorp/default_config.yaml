  ### Route Information Start ###
  # - id: tool_commodity_route
  #   name: Provide commodity routes
  #   hint: If enabled, this skill can provide UEX trade routes for commodities (including illegal commodities, which are marked with a warning).
  #   value: true
  #   required: true
  #   property_type: boolean

  - id: commodity_route_default_count
    name: Default trade route count
    value: 1
    required: true
    property_type: number

  - id: commodity_route_default_max_stops
    name: Default trade route stops
    hint: "Most stops after the start when you don't ask for a number (1-5). 1 = buy at A, sell at B. More stops can buy and sell along the way, e.g. collect a commodity at two terminals."
    value: 1
    required: true
    property_type: number

  - id: commodity_route_use_estimated_availability
    name: Use Estimated Availability
    hint: Enable this option to take estimated scu availability into account for trade route calculations.
    value: true
    required: true
    property_type: boolean

  - id: commodity_route_ranking
    name: Trade route ranking
    hint: "How trade routes are compared. Profit per stop: best earnings for the stops flown. Profit per distance: best earnings for the distance traveled. Total profit: highest overall profit, favors routes with more stops."
    property_type: single_select
    value: "profit_per_stop"
    required: true
    options:
      - label: "Profit per stop"
        value: "profit_per_stop"
      - label: "Profit per distance"
        value: "profit_per_distance"
      - label: "Total profit"
        value: "total_profit"

  - id: commodity_route_advanced_info
    name: Show advanced trade route info
    hint: Shows additional information as more location data (terminal name is always included), flags if locations are monitored and more like profit per stop and return on investment.
    value: false
    required: true
    property_type: boolean
  ### Route Information End ###

