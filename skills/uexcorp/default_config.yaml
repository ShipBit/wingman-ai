module: skills.uexcorp.main
name: UEXCorp
api_version: 3
version: 3.0.0
display_name: UEXCorp
author: JayMatthew
tags:
  - Game
  - Star Citizen
  - Internet
description:
  en: Star Citizen trade routes, commodity prices, locations, ships and items from UEX community data.
  de: Handelsrouten, Warenpreise, Orte, Schiffe und Items für Star Citizen aus den Community-Daten von UEX.
discovery_keywords:
  - trading
  - routes
  - cargo
  - commodities
  - ships
  - Hull-C
  - Caterpillar
  - mining
  - hauling
  - profit
  - terminals
discoverable_by_default: false
prompt: |
  ### UEX (Star Citizen trade data)
  Live data from UEX: commodity prices and terminals, trade routes, locations, ships and items.

  Rules:
  - Price, commodity, trade, location or ship questions: call a UEX function right away with everything you know (ship, money, location). Ask only for what is missing.
  - Buy and sell options: say the stock or demand status (e.g. "high stock" when buying, "no demand" when selling).
  - Lists: at most 5 entries, and say how many there are in total. Summary first, details on request.
  - Say negative values as "minus X percent".
  - Several calls for one answer: make them silently, explain only in the final answer. For a profit calculation, get missing prices from the other functions before asking.
  - "Relay to user" notes: pass them on, condensed.
  - Loading docks (e.g. Hull-C) and container sizes are already part of the trade routes.
  - Star systems in trade routes: always pass the ones the user names as filter_star_system_whitelist, e.g. "only Stanton" = ["Stanton"].
  - Keep answers short: they are spoken.

