module: skills.sc_accountant.main
name: SC_Accountant
api_version: 3
display_name: Star Citizen Accountant
author: Mallachi
requires:
  - sc_gamelog
auto_activate: true
tags: [Star Citizen, Finance, Operations]
description:
  en: Track personal money, cargo, operations, refining, fleet and plans in Simple or Advanced mode. Trades and rewards are booked from the Star Citizen log, and a dashboard shows everything on your computer or phone.
  de: Führt deine Finanzen, Fracht, Einsätze, Raffinerie, Flotte und Pläne, einfach oder ausführlich. Käufe, Verkäufe und Belohnungen werden aus dem Star Citizen Log gebucht, und ein Dashboard zeigt alles am Rechner oder Handy.
discovery_keywords: [accountant, ERP, profit, spending, balance, cargo, inventory, refinery, fleet, budget, operation, aUEC, reconciliation]
prompt: |
  Use erp_report for recorded finances and operational status. Use help to discover
  actions and help:ACTION for fields before erp_record. Keep answers brief.
  Never invent prices, quantities, balances, confirmations, or missing costs.
  Pending game requests are not completed trades. Recorded balance may differ
  from the game wallet. Unknown costs mean incomplete profit. Simple and Advanced
  share the same records; switching mode never clears history. Use erp_dashboard
  for detailed editing. Import legacy records only on an explicit user request.
  Background capture uses no model calls; never repeatedly poll through tools.
hint:
  en: >
    <p>Personal operations, finances, inventory, refining, fleet and planning.
    Simple keeps daily work short. Advanced shows detailed records and costing.</p>
    <p>Trades and rewards are booked automatically from the Star Citizen log. Switch
    it on under Settings. Without it, manual entry remains available. Records of the
    old accountant stay untouched. Ask your Wingman to import them.</p>
examples:
  - en: How did my mining run do?
  - en: Record 500 aUEC for fuel
  - en: What cargo do I have recorded?
  - en: Show things needing attention
  - en: Open my accounting dashboard
custom_properties:
  - id: complexity_layer
    name: Experience
    hint: Simple or Advanced views of the same records. The dashboard keeps its own choice until you change this setting again.
    property_type: single_select
    value: simple
    required: false
    options:
      - label: Simple
        value: simple
      - label: Advanced
        value: advanced
  - id: dashboard_port
    name: Local dashboard port
    hint: Local port 1024-65535. Changes apply when the dashboard next starts.
    property_type: number
    value: 7863
    required: false
