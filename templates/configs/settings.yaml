debug_mode: false
audio: {}
streamer_mode: false
cancel_tts_key: "shift+y"
cancel_tts_joystick_button: null
stt:
  # Which provider transcribes what you say. One choice for every wingman and
  # for both ways of talking (record key and voice activation).
  provider: parakeet
  # Languages the cloud provider may auto-detect. The local providers have
  # their own language field.
  languages:
    - en-US
    - de-DE
  parakeet:
    run_locally: true
    model_variant: v3
    execution_provider: cpu
    host: http://127.0.0.1
    port: 9876
  parakeet_config:
    temperature: 0.0
  fasterwhisper:
    model_size: base
    device: cpu
    compute_type: auto
  fasterwhisper_config:
    beam_size: 1
    best_of: 2
    temperature: 0
    no_speech_threshold: 0.7
    language_detection_threshold: 0.5
    multilingual: false
    hotwords: []
  whispercpp:
    host: http://127.0.0.1
    port: 8080
  whispercpp_config:
    temperature: 0.0
voice_activation:
  enabled: false
  mute_toggle_key: "shift+x"
  # How easily the voice detector opens: 0 needs a clear voice, 1 opens on a
  # whisper. Applies to push-to-talk too, where it trims silence off the clip.
  sensitivity: 0.5
  # Silence that ends an utterance.
  end_pause_ms: 700
  # Cut here even mid-sentence and send what was said; the rest becomes the
  # next utterance. Keeps commands quick for people who never stop talking.
  max_utterance_s: 12
  min_speech_ms: 200
  pre_roll_ms: 300
  # Keep listening while a wingman speaks: "stop" stops it, talking on skips
  # the answer. With speakers the wingman's own voice is filtered by text.
  listen_while_speaking: true
  # Said alone, these stop a wingman mid-sentence and are not answered.
  stop_words:
    - "stop"
    - "stopp"
    - "stop it"
    - "stop please"
    - "shut up"
    - "be quiet"
    - "silence"
    - "enough"
    - "halt"
    - "sei still"
    - "ruhe"
    - "schluss"
    - "bitte stopp"
    - "okay stop"
    - "basta"
    - "silencio"
    - "para"
    - "cállate"
    - "callate"
    - "arrête"
    - "arrete"
    - "tais-toi"
    - "assez"
    - "stop s'il te plaît"
wingman_pro:
  base_url: https://api.wingman-ai.com
xvasynth:
  enable: false
  host: http://127.0.0.1
  port: 8008
  install_dir: C:\Program Files (x86)\Steam\steamapps\common\xVASynth
  process_device: cpu
pocket_tts:
  enable: true
  run_locally: true
  model: "english_2026-04"
  quantize: true
  host: "localhost"
  port: 5002
llama_cpp:
  # cloud | local | server — where the support model runs. Cloud is the default:
  # it costs the user no RAM and no CPU while a game is running.
  mode: cloud
  # Empty means the plan's default support model. A gateway id like
  # google/gemini-2.5-flash-lite picks a specific one.
  support_cloud_model: ""
  gpu_backend: cpu
  support_model: "Qwen3.5-2B-Q4_K_M.gguf"
  embed_model: "nomic-embed-text-v1.5.f16.gguf"
  n_ctx: 4096
  n_threads: 0
  support_remote_host: "http://127.0.0.1"
  support_remote_port: 49152
  embed_remote_host: "http://127.0.0.1"
  embed_remote_port: 49153
spoken_language: "multilingual"
hud_server:
  enabled: false
  host: "127.0.0.1"
  port: 7862
  framerate: 60
  layout_margin: 20
  layout_spacing: 15
  screen: 1
