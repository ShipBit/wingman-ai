commands:
  - name: Flight Ready
    description: Power the ship up from cold and make it ready to fly. This is what "get ready", "spin her up", "start the ship" and "ready for departure" mean. The ship stays on the pad; nothing takes off.
    additional_context: All ship systems turned on and ready for takeoff
    category_id: 01120b29-2487-422e-82ff-6327eacbd7fe
    is_system_command: false
    instant_activation:
      - Power up the ship
      - Start the ship
      - Flight Ready
    force_instant_activation: false
    actions:
      - keyboard:
          hotkey: alt gr
          press: true
      - wait: 0.55
      - keyboard:
          hotkey: r
          hold: 0.1
      - wait: 0.15
      - keyboard:
          hotkey: alt gr
          release: true
  - name: Next Operator Mode
    description: 'Step to the next operator mode of the seat: flight, weapons, scanning, mining.'
    category_id: 8483a2f5-5273-435f-82ee-561c5a485317
    is_system_command: false
    force_instant_activation: false
    actions:
      - mouse:
          button: middle
  - name: Toggle Light Amplification
    description: 'Night vision in the helmet or cockpit: amplify what little light there is. Not the headlights.'
    category_id: 8483a2f5-5273-435f-82ee-561c5a485317
    is_system_command: false
    force_instant_activation: false
    actions:
      - keyboard:
          hotkey: alt gr
          press: true
      - wait: 0.25
      - keyboard:
          hotkey: l
          hold: 0.15
      - wait: 0.2
      - keyboard:
          hotkey: alt gr
          release: true
  - name: Toggle Hardpoint Lock
    description: Lock the weapon hardpoints in place so they stop tracking.
    category_id: 01120b29-2487-422e-82ff-6327eacbd7fe
    is_system_command: false
    force_instant_activation: false
    actions:
