          hotkey: alt gr
          press: true
      - wait: 0.35
      - keyboard:
          hotkey: k
          hold: 0.1
      - wait: 0.1
      - keyboard:
          hotkey: alt gr
          release: true
  - name: Cycle Camera View
    description: Step to the next camera angle, without choosing a specific one.
    category_id: f65a8f08-4c7d-4a33-8473-96e00614504d
    is_system_command: false
    force_instant_activation: false
    actions:
      - keyboard:
          hotkey: f4
  - name: Toggle Cruise Mode
    description: Hold the current speed without the throttle being touched, like cruise control in a car.
