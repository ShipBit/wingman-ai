    is_system_command: false
    force_instant_activation: false
    actions:
      - keyboard:
          hotkey: alt+c
  - name: Toggle Decoupled Mode
    description: Let the ship drift instead of holding its heading, so the nose can point away from the direction of travel.
    category_id: 59907f6d-16e2-4bc5-8cb0-676ff78f94b0
    is_system_command: false
    force_instant_activation: false
    actions:
      - keyboard:
          hotkey: c
  - name: Toggle Landing System
    description: The landing gear alone. Lower it or raise it. Nothing else happens, the ship is not landed and no autopilot is engaged.
    category_id: 59907f6d-16e2-4bc5-8cb0-676ff78f94b0
    is_system_command: false
    force_instant_activation: false
    actions:
      - keyboard:
          hotkey: n
  - name: Toggle VToL
    description: Swivel the thrusters for vertical take-off and landing.
    category_id: 59907f6d-16e2-4bc5-8cb0-676ff78f94b0
    is_system_command: false
    force_instant_activation: false
