  # ElevenLabs' hosted server only accepts an OAuth token — it answers 401 to an
  # API key. Pressing Authorize in a wingman's MCP settings opens the consent
  # page and stores the token; see docs/mcp-oauth.md.
  #
  # ElevenLabs has no dynamic client registration, so `oauth_client_id` has to
  # name a client id metadata document. The one below is served by Wingman's own
  # worker.
  - name: elevenlabs
    display_name: ElevenLabs
    description: ElevenLabs generative media. Generate images and video from a prompt, turn text into speech, transcribe audio, design new voices and browse the voice library.
    discovery_keywords:
      - ElevenLabs
      - 11labs
      - generate an image
      - create a picture
      - generate a video
      - text to speech
      - read this out loud
      - voice
      - design a voice
      - transcribe
      - speech to text
    type: http
    url: https://api.us.elevenlabs.io/v1/mcp
    auth: oauth
    oauth_client_id: https://wingman-ai-mcp-servers.wingman-ai.workers.dev/oauth/client
    # Every generator runs through a flow, so `flows` is not optional: without
    # it even speech answers 403. `image_video_generation` covers the two
    # visual tools. `convai_read` is gone with the agents_* tools.
    oauth_scopes:
      - flows
      - image_video_generation
      - text_to_speech
      - voice_generation
      - speech_history_read
    # ElevenLabs offers 111 tools measuring roughly 222,000 tokens, more than
    # most context windows hold. Every tool stays visible in the UI with a
    # switch; these 104 are off by default. What is left is what a voice
    # assistant reaches for: image, video, speech, image edit, transcription,
    # the voice list and `get_flow_run_status`, which is not optional because
    # generation is asynchronous and without it a result never comes back.
    disabled_tools:
      - agents_list
      - agents_get
      - agents_get_summaries
      - agents_get_widget
      - agents_get_link
      - agents_get_knowledge_size
      - agents_calculate_llm_usage
      - agents_list_conversations
      - agents_get_conversation
      - agents_duplicate
      - agents_delete
      - agents_search_conversation_messages
      - agents_resolve_conversation
      - agents_get_topics
      - agents_list_branches
      - agents_get_branch
      - agents_update_branch
      - agents_get_version
      - agents_merge_branch_preview
      - agents_merge_branch
      - agents_create_deployment
      - agents_create_draft
      - agents_delete_draft
      - agents_create_procedure
      - agents_list_procedures
      - agents_get_procedure
      - agents_delete_procedure
      - agents_compile_procedures
      - agents_get_procedure_draft
      - agents_update_procedure_draft
      - agents_delete_procedure_draft
      - agents_list_knowledge_base
      - agents_get_kb_document
      - agents_create_kb_text
      - agents_create_kb_url
      - agents_create_kb_folder
      - agents_update_kb_document
