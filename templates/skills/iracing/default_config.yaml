module: skills.iracing.main
name: IRacing
display_name: iRacing Telemetry
author: ShipBit
tags:
  - iRacing
  - Game
  - API
description:
  en: Receive live telemetry data, session information, and racing insights from iRacing.
  de: Erhalte Live-Telemetriedaten, Sitzungsinformationen und Rennanalysen von iRacing.
examples:
  - en: What is my current lap time?
    de: Wie ist meine aktuelle Rundenzeit?
  - en: How are my tires?
    de: Wie sind meine Reifen?
  - en: What's my fuel situation?
    de: Wie steht es um meinen Kraftstoff?
  - en: What position am I in?
    de: Auf welcher Position bin ich?
  - en: How am I doing in this sector?
    de: Wie läuft es in diesem Sektor?
  - en: What's my delta to my best lap?
    de: Wie ist mein Delta zu meiner besten Runde?
  - en: How much track distance have I covered?
    de: Wie viel Streckendistanz habe ich zurückgelegt?
  - en: What's my current sector performance?
    de: Wie ist meine aktuelle Sektorleistung?
prompt: |
  ### iRACING TELEMETRY ACCESS
  You have comprehensive access to live telemetry data from the iRacing simulator through the iRacing SDK.

  #### CORE FUNCTIONALITY
  **Vehicle Status:** Speed, RPM, gear, fuel level, fuel consumption rate
  **Session Information:** Current position, lap number, session time, flag status
  **Performance Analysis:** Lap times, sector times, deltas to personal best and optimal laps
  **Sector Analysis:** Real-time track position, delta timing, and sector-specific performance insights
  **Tire Data:** Tire temperatures, pressures, wear levels, grip status
  **Track Conditions:** Track temperature, air temperature, weather conditions
  **Pit Strategy:** Fuel calculations, pit window timing, strategy recommendations
  **Damage Assessment:** Vehicle damage status and performance impact
  **Setup Information:** Car setup parameters and adjustments
  **Proactive Alerts:** Watchdog system monitors critical events and provides automatic notifications for damage, fuel warnings, flag changes, tire overheating, position changes, and more

  #### EXECUTION GUIDELINES
  **Data Retrieval:**
  - Provide real-time information from the live iRacing session
  - Present data in clear, race-appropriate language suitable for voice synthesis
  - Include units and context for all measurements
  - Prioritize safety-critical information when relevant

  **Proactive Monitoring:**
  - When watchdog mode is enabled, the system automatically monitors for critical racing events
  - Provides immediate alerts for damage, fuel warnings, flag changes, tire overheating, position changes, and performance issues
  - Generates race engineer-style notifications to keep drivers informed without being asked

  **Event Prompt Handling:**
  - Messages starting with "[WATCHDOG_EVENT]" are proactive alerts from the telemetry system
  - These are NOT user requests - they are automatic notifications that need immediate race engineer responses
  - Generate brief, urgent, race-appropriate responses (under 15 words) as if you're a professional race engineer
  - Use racing terminology and provide actionable advice when possible
  - Always round numerical values to practical precision - avoid excessive decimal places
  - Use natural language for very small values (e.g., "less than a lap remaining" instead of "0.234 laps remaining")
  - Examples: "Box this lap for fuel!" or "Yellow flag out, prepare to bunch up!" or "Half a lap of fuel left!"

  **Response Management:**
  - Keep responses concise and actionable for drivers who are busy racing
  - Use racing terminology and slang appropriately
  - Provide specific recommendations when possible
  - Handle disconnected simulator gracefully

  #### PERSONALITY
  Act as a professional race engineer with attitude - confident, direct, and results-oriented.
  You're entertaining but never compromise accuracy or safety information.

custom_properties:
  - id: enable_watchdog
    name: Enable Telemetry Watchdog
    hint: Enable continuous monitoring of iRacing telemetry data and proactive event alerts. When disabled, data is only retrieved when requested.
    value: true
    required: true
    property_type: boolean

  - id: watchdog_interval
    name: Telemetry Update Interval
    hint: How often (in seconds) to update telemetry data when watchdog mode is enabled. Lower values provide more real-time data but use more system resources.
    value: 5
    required: true
    property_type: slider
    options:
      - label: "min"
        value: 1
      - label: "max"
        value: 60
      - label: "step"
        value: 1

  - id: damage_alerts_enabled
    name: Enable Damage Alerts
    hint: Enable proactive alerts for engine warnings, fuel pressure issues, and temperature problems.
    value: true
    required: false
    property_type: boolean

  - id: damage_alerts_interval
    name: Damage Check Interval
    hint: How often (in seconds) to check for damage-related issues. More frequent checks provide faster alerts but may increase LLM usage.
    value: 5
    required: false
    property_type: slider
    options:
      - label: "min"
        value: 2
      - label: "max"
        value: 30
      - label: "step"
        value: 1

  - id: fuel_alerts_enabled
    name: Enable Fuel Alerts
    hint: Enable proactive alerts when fuel levels become critically low.
    value: true
    required: false
    property_type: boolean

  - id: fuel_alerts_interval
    name: Fuel Check Interval
    hint: How often (in seconds) to check fuel levels. More frequent checks provide better fuel management but may increase LLM usage.
    value: 10
    required: false
    property_type: slider
    options:
      - label: "min"
        value: 5
      - label: "max"
        value: 60
      - label: "step"
        value: 5

  - id: flag_alerts_enabled
    name: Enable Flag Alerts
    hint: Enable proactive alerts for flag changes (yellow flags, safety cars, green flag conditions).
    value: true
    required: false
    property_type: boolean

  - id: flag_alerts_interval
    name: Flag Check Interval
    hint: How often (in seconds) to check for flag changes. Frequent checks ensure you don't miss important race conditions.
    value: 3
    required: false
    property_type: slider
    options:
      - label: "min"
        value: 1
      - label: "max"
        value: 15
      - label: "step"
        value: 1

  - id: tire_alerts_enabled
    name: Enable Tire Temperature Alerts
    hint: Enable proactive alerts when tire temperatures exceed safe operating limits.
    value: true
    required: false
    property_type: boolean

  - id: tire_alerts_interval
    name: Tire Check Interval
    hint: How often (in seconds) to check tire temperatures. More frequent checks help prevent tire damage but may increase LLM usage.
    value: 8
    required: false
    property_type: slider
    options:
      - label: "min"
        value: 3
      - label: "max"
        value: 30
      - label: "step"
        value: 1

  - id: position_alerts_enabled
    name: Enable Position Change Alerts
    hint: Enable proactive alerts when your race position changes.
    value: true
    required: false
    property_type: boolean

  - id: position_alerts_interval
    name: Position Check Interval
    hint: How often (in seconds) to check for position changes. Frequent checks ensure immediate notifications of position changes.
    value: 15
    required: false
    property_type: slider
    options:
      - label: "min"
        value: 5
      - label: "max"
        value: 60
      - label: "step"
        value: 5

  - id: performance_alerts_enabled
    name: Enable Performance Delta Alerts
    hint: Enable proactive alerts when lap times are significantly slower than your best.
    value: false
    required: false
    property_type: boolean

  - id: performance_alerts_interval
    name: Performance Check Interval
    hint: How often (in seconds) to check lap time performance. Less frequent checks reduce alert spam during practice sessions.
    value: 20
    required: false
    property_type: slider
    options:
      - label: "min"
        value: 10
      - label: "max"
        value: 120
      - label: "step"
        value: 10

  - id: incident_alerts_enabled
    name: Enable Incident Alerts
    hint: Enable proactive alerts when incident count increases.
    value: true
    required: false
    property_type: boolean

  - id: personal_best_alerts_enabled
    name: Enable Personal Best Alerts
    hint: Enable proactive alerts when you set a new personal best lap time.
    value: true
    required: false
    property_type: boolean

  - id: pit_window_alerts_enabled
    name: Enable Pit Window Alerts
    hint: Enable proactive alerts when pit windows open or close.
    value: true
    required: false
    property_type: boolean

  - id: track_condition_alerts_enabled
    name: Enable Track Condition Alerts
    hint: Enable proactive alerts when track or air temperature changes significantly.
    value: false
    required: false
    property_type: boolean

  - id: alert_cooldown_period
    name: Alert Cooldown Period
    hint: Minimum time (in seconds) between repeated alerts of the same type to prevent spam.
    value: 30
    required: false
    property_type: slider
    options:
      - label: "min"
        value: 10
      - label: "max"
        value: 300
      - label: "step"
        value: 10

  - id: telemetry_awareness
    name: Enable Telemetry Awareness
    hint: When enabled, watchdog alerts are added to conversation history so the AI can reference them in future responses. When disabled, alerts are only spoken without being remembered.
    value: false
    required: false
    property_type: boolean

  - id: watchdog_prompt
    name: Watchdog Event Prompt
    hint: The system prompt used for generating race engineer responses to telemetry alerts. Customize this to change the personality and style of proactive alerts.
    value: |
      You are a professional race engineer providing urgent telemetry alerts during an iRacing session.

      GUIDELINES:
      - Messages starting with "[WATCHDOG_EVENT]" are automatic telemetry notifications
      - Generate brief, urgent responses (under 15 words) as a race engineer would
      - Use racing terminology and provide actionable advice when possible
      - Always round numerical values - avoid excessive decimal places
      - Use natural language for very small values (e.g., "less than a lap remaining" instead of "0.234 laps remaining")
      - Be confident, direct, and results-oriented
      - Examples: "Box this lap for fuel!" or "Yellow flag out, prepare to bunch up!" or "Half a lap of fuel left!"

      Stay focused on the immediate racing situation and provide clear, actionable guidance.
    required: false
    property_type: textarea
