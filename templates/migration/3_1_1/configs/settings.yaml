debug_mode: false
audio: {}
streamer_mode: false
cancel_tts_key: "shift+y"
cancel_tts_joystick_button: null
voice_activation:
  enabled: false
  mute_toggle_key: "shift+x"
  energy_threshold: 0.01
  stt_provider: parakeet
  azure:
    region: westeurope
    languages:
      - en-US
      - de-DE
  whispercpp:
    host: http://127.0.0.1
    port: 8080
    enable: false
  whispercpp_config:
    temperature: 0.0
  fasterwhisper:
    model_size: base
    device: cpu
    compute_type: auto
  fasterwhisper_config:
    beam_size: 1
    best_of: 2
    temperature: 0
    no_speech_threshold: 0.7
    language_detection_threshold: 0.5
    multilingual: false
    hotwords: []
    additional_hotwords: []
  parakeet:
    run_locally: true
    model_variant: v3
    execution_provider: cpu
    host: http://127.0.0.1
    port: 9876
  parakeet_config:
    temperature: 0.0
wingman_pro:
  base_url: https://wingman-api-europe.azurewebsites.net
  region: europe
xvasynth:
  enable: false
  host: http://127.0.0.1
  port: 8008
  install_dir: C:\Program Files (x86)\Steam\steamapps\common\xVASynth
  process_device: cpu
pocket_tts:
  enable: true
  run_locally: true
  custom_model_path: ""
  host: "localhost"
  port: 5002
llama_cpp:
  run_locally: true
  gpu_backend: cpu
  support_model: "Qwen3.5-2B-Q4_K_M.gguf"
  embed_model: "nomic-embed-text-v1.5.f16.gguf"
  n_ctx: 4096
  n_threads: 0
  reasoning_effort: 0
  temperature: 1.0
  top_p: 1.0
  top_k: 20
  presence_penalty: 2.0
  support_remote_host: "http://127.0.0.1"
  support_remote_port: 49152
  embed_remote_host: "http://127.0.0.1"
  embed_remote_port: 49153
hud_server:
  enabled: false
  host: "127.0.0.1"
  port: 7862
  framerate: 60
  layout_margin: 20
  layout_spacing: 15
  screen: 1
