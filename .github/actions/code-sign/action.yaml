name: "Sign files"
description: "Sign Windows binaries with Azure Artifact Signing"
# The calling job needs `permissions: id-token: write`, and the Entra app
# registration needs a federated credential that matches the job (docs/ci-cd.md).
inputs:
  files:
    description: "Files to sign, relative to the workspace, one per line"
    required: true
  azure-client-id:
    description: "Client ID of the Entra app registration that holds the signer role"
    required: true
  azure-tenant-id:
    description: "Entra tenant ID"
    required: true
  azure-subscription-id:
    description: "Azure subscription of the Artifact Signing account"
    required: true
  endpoint:
    description: "Artifact Signing endpoint of the account's region, e.g. https://weu.codesigning.azure.net"
    required: true
  signing-account-name:
    description: "Artifact Signing account name"
    required: true
  certificate-profile-name:
    description: "Certificate profile name"
    required: true
runs:
  using: "composite"
  steps:
    # GitHub does not enforce `required` for a composite action, and an unset
    # secret or variable arrives as an empty string.
    - name: Check inputs and resolve files
      id: files
      shell: pwsh
      env:
        FILES: ${{ inputs.files }}
        AZURE_CLIENT_ID_INPUT: ${{ inputs.azure-client-id }}
        AZURE_TENANT_ID_INPUT: ${{ inputs.azure-tenant-id }}
        AZURE_SUBSCRIPTION_ID_INPUT: ${{ inputs.azure-subscription-id }}
        ENDPOINT_INPUT: ${{ inputs.endpoint }}
        ACCOUNT_NAME_INPUT: ${{ inputs.signing-account-name }}
        PROFILE_NAME_INPUT: ${{ inputs.certificate-profile-name }}
      run: |
        $required = [ordered]@{
          'AZURE_CLIENT_ID (secret)' = $env:AZURE_CLIENT_ID_INPUT
          'AZURE_TENANT_ID (secret)' = $env:AZURE_TENANT_ID_INPUT
          'AZURE_SUBSCRIPTION_ID (secret)' = $env:AZURE_SUBSCRIPTION_ID_INPUT
          'ARTIFACT_SIGNING_ENDPOINT (variable)' = $env:ENDPOINT_INPUT
          'ARTIFACT_SIGNING_ACCOUNT_NAME (variable)' = $env:ACCOUNT_NAME_INPUT
          'ARTIFACT_SIGNING_PROFILE_NAME (variable)' = $env:PROFILE_NAME_INPUT
        }
        $missing = @($required.Keys | Where-Object { -not $required[$_] })
        if ($missing.Count -gt 0) {
          throw "Not set for this job: $($missing -join ', ')"
        }

        $paths = @()
        foreach ($line in ($env:FILES -split "`n")) {
          $relative = $line.Trim()
          if (-not $relative) { continue }
          $full = Join-Path $env:GITHUB_WORKSPACE $relative
          if (-not (Test-Path -LiteralPath $full -PathType Leaf)) {
            throw "File to sign not found: $full"
          }
          $paths += (Resolve-Path -LiteralPath $full).Path
        }
        if ($paths.Count -eq 0) {
          throw "No files to sign"
        }
        "paths=$($paths -join ',')" >> $env:GITHUB_OUTPUT

    # OIDC: no secret is stored. Azure accepts the login because the app
    # registration has a federated credential for this job's subject.
    - name: Log in to Azure
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    # The certificates live three days. The timestamp is what keeps a signature
    # valid after that.
    - name: Sign
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ inputs.endpoint }}
        signing-account-name: ${{ inputs.signing-account-name }}
        certificate-profile-name: ${{ inputs.certificate-profile-name }}
        files: ${{ steps.files.outputs.paths }}
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Verify signatures
      shell: pwsh
      env:
        PATHS: ${{ steps.files.outputs.paths }}
      run: |
        foreach ($file in ($env:PATHS -split ',')) {
          $signature = Get-AuthenticodeSignature -LiteralPath $file
          Write-Host "$file -> $($signature.Status), signed by: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') {
            throw "Signature of $file is $($signature.Status): $($signature.StatusMessage)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Signature of $file has no timestamp"
          }
        }
