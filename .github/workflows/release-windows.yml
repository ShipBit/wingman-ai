name: Build Core (Windows)

# Only called by dev-build.yml and by the client's release run, never by a tag.
# Tags mark what the testers got; pushing one must not build anything.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'github'
      channel:
        description: "Update channel the build ships on: unstable or production. Decides which features Core offers (services/features.py) and where it is staged."
        type: string
        default: 'unstable'
    outputs:
      version:
        description: "Extracted version from system_manager.py"
        value: ${{ jobs.sign-windows-executable.outputs.version }}
      artifact_name:
        description: "Name of the signed artifact"
        value: ${{ jobs.sign-windows-executable.outputs.artifact_name }}

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: ${{ inputs.runner == 'blacksmith' && 'blacksmith-4vcpu-windows-2025' || 'windows-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from system_manager.py
        id: version
        shell: bash
        run: |
          version=$(grep -oE 'LOCAL_VERSION\s*=\s*"[^"]+"' services/system_manager.py | sed 's/.*"\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected version: $version"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.7'

      - name: Create and activate venv
        run: |
          python -m venv venv
          .\venv\Scripts\Activate

      - name: Install Dependencies
        run: |
          .\venv\Scripts\Activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # PowerShell only fails the step on the last command's exit code.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Fails when onnxruntime-gpu and the bundled CUDA runtime don't match,
          # which would put Parakeet on the CPU without a word in the log.
          python scripts/check_onnxruntime_gpu.py

      - name: Set build channel
        run: python scripts/set_build_channel.py ${{ inputs.channel }}

      - name: Build with PyInstaller
        run: |
          .\venv\Scripts\Activate
          pyinstaller WingmanAiCore.spec --noconfirm

      - name: Upload Windows Exe Artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-windows-unsigned
          path: dist/WingmanAiCore/
          retention-days: 1

  sign-windows-executable:
    needs: build-windows
    # The Artifact Signing action supports the GitHub-hosted windows-2022 and
    # windows-2025 images.
    runs-on: windows-2022
    # The Azure login is tied to this environment (federated credential of the
    # app registration). It holds the signing secrets and variables.
    environment: signing
    permissions:
      id-token: write  # Azure login without a stored secret (OIDC)
      contents: read
      actions: write  # delete the unsigned artifact
    outputs:
      version: ${{ needs.build-windows.outputs.version }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: core-windows-unsigned
          path: WingmanAiCore

      # WingmanAiInput.exe too: Windows grants it UIAccess only with a valid
      # signature.
      - name: Sign
        uses: ./.github/actions/code-sign
        with:
          files: |
            WingmanAiCore/WingmanAiCore.exe
            WingmanAiCore/WingmanAiInput.exe
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE_NAME }}

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          artifact_name="WingmanAiCore-${{ needs.build-windows.outputs.version }}-x86_64-pc-windows"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WingmanAiCore-${{ needs.build-windows.outputs.version }}-x86_64-pc-windows
          path: WingmanAiCore
          retention-days: 5

      - name: Delete unsigned intermediate artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: core-windows-unsigned

      - name: Upload to R2 staging
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          pip install awscli
          bash .github/scripts/stage-core.sh "${{ inputs.channel }}" windows-x86_64 WingmanAiCore
