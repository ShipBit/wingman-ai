name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system libraries
        # sounddevice needs PortAudio and pedalboard libatomic at import time.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libatomic1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The CPU build of torch, as in the Linux release: the PyPI build
          # brings about 4 GB of CUDA libraries the tests never use.
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          # The NVIDIA CUDA wheels only matter for GPU speech recognition.
          grep -v '^nvidia-' requirements.txt > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt" -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
