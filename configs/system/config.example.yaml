# ───────────────────────────── Questions? ──────────────────────────────
# Discord server: https://discord.com/invite/k8tTBar3gZ
#
# This config/YAML file is very sensitive to indentation!
# Make sure you use a single "TAB" character for indentation. Do NOT use the spacebar to indent.
# More docs and useful tools to edit this here:
#   https://github.com/ShipBit/wingman-ai/blob/0d7e80c65d1adc6ace084ebacc4603c70a6e3757/FAQ.md

# ==================================== GLOBAL CONFIGURATION ====================================
# This is the default config for all wingmen.
# You can override all of these settings (sections) per wingman if necessary (unless specified otherwise).
# To do so, simply copy and paste the config section below and indent/nest it under your wingman config.
#
# ──────────────────────────────── FEATURES ─────────────────────────────────
features:
  debug_mode: false # If enabled, the Wingman will skip executing any keypresses. It will also print more debug messages and benchmark results.

  transcript_ignore:
    response: Ok, befehl ignoriert
    match_whole_words: true
    phrases:
    - abbruch
    - abbrechen
    - ignorier
    - ignoriere
    - ignorieren
    - ignoriert
  
  command_and_tts_cache:
    cache_instant_commands: true # Setze auf true, um das Caching für Instant Commands zu aktivieren
    cache_tts_responses: true    # Setze auf true, um das Caching für TTS-Antworten zu aktivieren
    instant_command_cache_max_size: 200 # Max items in memory LRU for commands
    tts_cache_max_size: 100           # Max items in memory LRU for TTS
    cache_match_stopwords_language: auto # auto uses openai.player_language; or de/en
    cache_match_stopwords:
      common:
      - was
      - ist
      - what
      - is
      - component
      - komponente
      de:
      - der
      - die
      - das
      - ein
      - eine
      - und
      - oder
      - zu
      - im
      - in
      - am
      - an
      - auf
      - mit
      - von
      - fur
      - bitte
      en:
      - the
      - a
      - an
      - and
      - or
      - to
      - in
      - on
      - at
      - by
      - with
      - from
      - for
      - please
    do_not_cache_phrases:
    - Hallo Cora
    - Bestätige
    - Ja, korrekt
    - Ja, Bitte
    - Jawohl
    - Yes
    - Yeah
    - Ausführen
    - Bitte
    - Los
    - No
    - Ja
    - Nein
    - Ja, tue es
    - Ich bestätige
    - Das ist korrekt
    - Übertrage jetzt alle Verkaufspreise
    - Führe einfach den Scan aus
    delete_last_cached_command_phrases:
    - Lösche den letzten Befehl
    - Befehl ignorieren
    - ignoriere den Befehl
    short_memory_commands: # these phrases will only be kept in cache as long as they are repeated consequently. A new cached phrase will automatically delete these cache entries
    - Wiederhole den letzten Befehl
    - Wiederhole
    - Führe den Befehl einfach aus
    
    
  
  # NOTE: Azure Subscriptions has rate limits far lower than other provider. You might reach these limits early if you have not high enough quota.

  # ─────────────────────── TTS Provider ─────────────────────────
  # You can override the text-to-spech provider if your Wingman supports it. Our OpenAI wingman does!
  # Note that the other providers may have additional config blocks as shown below for edge_tts. These are only used if the provider is set here.
  tts_provider: openai # available: openai, azure

  # ─────────────────────── Speech to text Provider ─────────────────────────
  # You can override the speech to text provider to use a different one than the default.
  # Note that the other providers may have additional config blocks as shown below for edge_tts. These are only used if the provider is set here.
  stt_provider: groq # available: openai, azure, groq, local (local = whisper + cuda)

  # ─────────────────────── Conversation Provider ─────────────────────────
  # You can override the conversation provider to use a different one than the default.
  # Note that the other providers may have additional config blocks as shown below for edge_tts. These are only used if the provider is set here.
  conversation_provider: groq # available: openai, azure, groq

  # ─────────────────────── Summarize Provider ─────────────────────────
  # You can override the summarize provider to use a different one than the default.
  # Note that the other providers may have additional config blocks as shown below fo•r edge_tts. These are only used if the provider is set here.
  summarize_provider: groq # available: openai, azure, groq

  # ─────────────────────── Cost Control ─────────────────────────
  # How many messages should a Wingman remember in your conversations?
  # "0" means you start fresh with just the context after every message. This is like restarting Wingman after every interaction.
  # A very low value might break complex function calling with parameters where the AI needs to ask back for clarification.
  #
  # Use this to limit the number of tokens used in your conversations and to reduce the cost of using the OpenAI API.
  # Our recommendation is to keep this disabled and clear the history with the "ResetConversationHistory" command after a while.
  #
  #remember_messages: 3 # uncomment this  (=remove the "# in front) to enable!

  # ────────────────────────────── SOUND SETTINGS ───────────────────────────────
# If you want to use sound effects with 11Labs, you need to enable them in the elevenlabs config below.
sound:
  # You can put as many sound effects here as you want. They stack and are added in the defined order here.
  # Available: RADIO, ROBOT, INTERIOR_HELMET, INTERIOR_SMALL, INTERIOR_MEDIUM, INTERIOR_LARGE
  effects:
    #- RADIO
    #- ROBOT

  # adds a beep/Quindar sound before and after the wingman talks
  play_beep: false

  volume: 0.3 # 0.0 - 1.0

# ────────────────────────────────── Local AI ────────────────────────────────────
local:
  stt_model: turbo # available: large, turbo

# ────────────────────────────────── OPEN AI ────────────────────────────────────
openai:
  # The model to use for conversations aka "chit-chat" and for function calls.
  # gpt-4 is more powerful than gpt-3.5 but also 10x more expensive.
  # gpt-3.5 is the default and should be enough for most use cases.
  # If something is not working as expected, you might want to test it with gpt-4.
  conversation_model: gpt-4.1-mini # available: gpt-5-mini, gpt-4.1-nano, gpt-4.1-mini, gpt-4o, gpt-4o-mini, gpt-3.5-turbo-1106, gpt-4-1106-preview (and more)
  # Optional reasoning effort for this provider/model call (supported values depend on the model/provider)
  #conversation_reasoning_effort: low # optional: low, medium, high

  # This model summarizes function responses, like API call responses etc.
  # In most cases gpt-3.5 should be enough.
  summarize_model: gpt-4.1-mini # gpt-5-mini, gpt-3.5-turbo-0125 # available: gpt-4o, gpt-4o-mini, gpt-3.5-turbo-1106, gpt-4-1106-preview (and more)
  #summarize_reasoning_effort: low # optional: low, medium, high

  summarize_instructions: |
    You are a professional voice‑script writer.

    **Task**  
    Read the information (text or json format) that follows  
    It contains:
    • technical_info – raw machine data and diagnostics  
    • error_messages – critical or warning level faults  
    • instructions – rules on how the data must be interpreted  
    • user_notes – general information for the end user  

    **Output**  
    Write a concise, listener‑friendly script tailored to the general context of the conversation in the given player language that can be spoken aloud.  
    Follow these formatting rules:

    1. Do NOT echo or quote any technical information or attributes unless required; only produce prose.  
    2. Obey instructions with highest priority.   
    3. Do not use technical terms of the JSON fields. Use them only to understand the context.   
    4. Keep sentences short (≤ 20 words)  

    Return ONLY the final script without any annotations or speaker information, just the raw text to be spoken by one person, nothing else.

  # The voice to use for OpenAI text-to-speech.
  # Only used if features > tts_provider is set to 'openai' above.
  tts_voice: nova # available: nova, alloy, echo, fable, onyx, shimmer
  tts_model: tts-1 # available: tts-1, tts-1-hd or gpt-4o-mini-tts
  tts_voice_instructions:  #| # leider kann man die Persona nicht "speichern", so dass sie jedes mal etwas anders klingt.
    # Voice characteristics:
    # - Accent: Standard (clear, neutral)
    # - Emotional range: lively and irreverent; flips between teasing sarcasm and exaggerated excitement
    # - Intonation: even phrase pacing with a gentle sentence‑final rise and minimal pitch fluctuation
    # - Impressions: friendly starship computer—helpful AI
    # - Speed of speech: brisk (≈ 150 WPM) with occasional slow‑downs to land a joke
    # - Tone: bright, crisp timbre with a youthful edge and a hint of rasp
    # - Whispering: rarely used, reserved for brief dramatic emphasis


  stt_model: gpt-4o-mini-transcribe # , gpt-4o-mini-transcribe, and whisper-1, gpt-4o-transcribe
  # ADVANCED:
  # If you want to use a different API endpoint, uncomment this and configure it here.
  # Use this to hook up your local in-place OpenAI replacement like Ollama or if you want to use a proxy.
  #base_url: https://api.openai.com # or the localhost address of your local LLM etc.
  #organization: whatever # If you have an organization key, you can set it here.

# ────────────────────────────────── AZURE ────────────────────────────────────
# Azure is a paid subscription provider from Microsoft which also offers OpenAI API access.
# If you configured some providers above to use Azure, you need to provide your Azure settings here.
# Please also provide your Azure API keys in the secrets.yaml.
azure:
  stt_model:
    api_base_url: https://cora-ai.openai.azure.com/ # https://xxx.openai.azure.com/
    api_version: 2024-06-01 # The API version to use. For a list of supported versions, see here: https://learn.microsoft.com/en-us/azure/ai-services/openai/reference
    deployment_name: whisper # The deployment name e.g. 'whisper'
  conversation:
    api_base_url: https://cora-ai.openai.azure.com/ # https://xxx.openai.azure.com/
    api_version: 2025-01-01-preview # The API version to use. For a list of supported versions, see here: https://learn.microsoft.com/en-us/azure/ai-services/openai/reference
    deployment_name: gpt-4o-mini # The deployment name e.g. 'whisper'
    #reasoning_effort: low # optional: low, medium, high
  summarize:
    api_base_url: https://cora-ai.openai.azure.com/ # https://xxx.openai.azure.com/
    api_version: 2025-01-01-preview # The API version to use. For a list of supported versions, see here: https://learn.microsoft.com/en-us/azure/ai-services/openai/reference
    deployment_name: gpt-4.1-nano # The deployment name e.g. 'whisper'
    #reasoning_effort: low # optional: low, medium, high
  tts:
    api_base_url: https://cora-ai.openai.azure.com/ # https://xxx.openai.azure.com/
    api_version: 2024-10-01-preview # The API version to use. For a list o
    deployment_name: tts # The deployment name e.g. 'whisper'
    region: swedencentral
    voice: nova

# ────────────────────────────────── GROQ ────────────────────────────────────
groq:
  base_url: https://api.groq.com/openai/v1
  stt_model: whisper-large-v3-turbo
  conversation_model: openai/gpt-oss-120b
  summarize_model: openai/gpt-oss-120b
  #conversation_reasoning_effort: low # optional: low, medium, high
  #summarize_reasoning_effort: low # optional: low, medium, high
  

# ────────────────────────────────── Global commands ───────────────────────────────────────
# These are available to all wingmen. You can override them per wingman if necessary.
#
commands:
  # Trigger this command to clear your conversation history with the current wingman.
  # This is like setting "remember_messages" to 0 above, but "on-demand". You'll restart with just the context.
  - name: ResetConversationHistory # don't rename this!
    instant_activation:
      - Forget everything!
      - Clear conversation history!
    responses:
      - Conversation history cleared.

wingmen:
  # ──────────────────────────────── Star-Citizen-AI ──────────────────────────────────────
  # "star-citizen-ai" is a full-custom wingman with its own Python code, see /wingmen/star_citizen_wingman.py.
  # This Wingman uses the OpenAiWingman as basis, but has some major differences:
  #
  #   1. It has Multi-Wingman Capabilities
  #   - Execute instant actions as of OpenAiWingman using the standard configuration -> Great for this!
  #   - Execute command chains as of OpenAiWingman (combining a series of key presses) -> Great for this!
  #  
  #   Big differences starts now:
  #   - Execute star-citizen commands as specified by your current keybinding-settings for a given release. All it needs is the default keybinding file + your exported keybinds overwrites. No need to config any commands but the instant-commands and the complex key changes
  #   - incorporates UEX trading API letting you ask for best trade route (1 stop) between locations, best trade route from a given location, best sell option for a commodity, best selling option for a commodity at a location
  #   - TODO incorporates Galactepedia-Wiki search to get more detailed information about the game world and lore in game
  #   - TODO incorporates Delivery Mission Management: based on delivery missionS (yes multiple) you are interested in, it will analyse the mission text, extract the payout, the locations from where you have to retrieve a package and the associated delivery location, calculates the best collection and delivery route to have to travel the least possible stops + incorporates profitable trade routes between the stops to earn an extra money on the trip.
  #   - TODO based on a given trading consoles it will extract the location, commodity prices and stock levels and update the prices automatically in the UEX database
  #  
  #   2. smart action selection with reduced context size
  #   - The system will get your command and will first ask GPT what kind of action the user wants to execute (one of the above)
  #   - The response will be used, to make another call to GPT now with the appropriate context information (commands for keypresses, trading calls, wiki calls, box mission calls...)
  #
  #   3. TODO Context-Logic cache: depending on your tasks, it will have different conversation-caches that will be selected on demand. Examples
  #   - If you execute a simple command, there is no need for a history, every gpt call can be fresh, effectively reducing cost of api usage. 
  #   - If you do a box mission, it will keep the history until you have completed your box mission(s), beeing able to guide you from box to box
  #   - If you do a trade, it will keep the history until it understands that you start your trading route from a complete different location.
  # 
  #   3. TODO Cache-Logic for text-to-speech responses to reduce cost with config parameters to specify the ammount of responses to be cached vs. dropped vs. renewed
  star-citizen-ai:
    record_key: x1  # mouse button
    features: # all features that Cora has. You can activated or deactivate features here.
      ComponentManager: True # True | False - provides basic information about ship components
      MiningManager:
        enabled: False # True | False - captures refinery work orders locally and looks up mining radar signatures.
        signature_observer:
          enabled: True # Starts local OCR observation while the MiningManager is active.
          debug_mode: False # Shows the active OCR scan area as a red overlay frame and prints debug logs.
          debug_log_interval_seconds: 2.0 # Minimum seconds between repeated debug log lines with the same throttle key.
          interval_seconds: 0.25 # Seconds between OCR scan attempts while the observer is active.
          focus_activation_grace_seconds: 1.0 # After Star Citizen regains focus, ignore Tab for this long so Alt+Tab does not count as a scan ping.
          activation_duration_seconds: 30 # Seconds OCR stays active after pressing Tab in Star Citizen.
          recognition_extension_seconds: 30 # After each successful read, keep OCR active for this many more seconds.
          stable_reads: 2 # Require this many identical known reads before updating the text overlay.
          stable_single_tick_support: 3 # Treat one OCR tick as stable if the same known value appears in at least this many OCR candidates.
          stable_miss_tolerance: 2 # Keep a pending known value through this many OCR misses so flaky reads can still confirm.
          unknown_clear_reads: 3 # Clear the last green text after this many consecutive unknown/max reads.
          display_duration_ms: 5000 # How long the green text stays visible; repeated same text refreshes this timer.
          display_cooldown_seconds: 3.0 # Minimum seconds before showing/logging the same stable signature again.
          overlay_offset_pixels: 2 # Legacy text offset; signature text now uses overlay_text_offset_* relative to the blinking dot.
          overlay_text_offset_x_pixels: 130 # Horizontal offset from the blinking dot to the text overlay center.
          overlay_text_offset_y_pixels: 8 # Vertical offset placing the text slightly above the blinking dot.
          debug_rectangle_auto_clear_ms: 120 # Auto-hide the red debug frame quickly so it is not captured by the next OCR screenshot.
          debug_overlay_pre_capture_clear_wait_ms: 50 # When debug_mode is on, clear the previous debug frame and wait briefly before taking the screenshot.
          vision_signature_fallback_enabled: True # Use Vision AI asynchronously for signature number crops.
          vision_signature_model:  # Optional model override for signature crops; empty uses open-ai-vision-model.
          vision_signature_min_interval_seconds: 5.0 # Minimum seconds between Vision AI crop requests to control cost.
          vision_signature_queue_size: 1 # Maximum queued Vision AI crops; keep this at 1 to avoid request backlogs.
          vision_signature_single_inflight: True # Do not queue a new Vision AI crop until the current request finished.
          vision_signature_near_duplicate_enabled: True # Compare pixels locally and skip crops that look like a recently sent crop.
          vision_signature_near_duplicate_cooldown_seconds: 30.0 # How long a similar crop suppresses another Vision AI request.
          vision_signature_near_duplicate_max_mean_delta: 18.0 # Average normalized text-mask delta under this threshold counts as near-duplicate.
          vision_signature_near_duplicate_history_size: 8 # Number of recent Vision AI crops kept for near-duplicate comparison.
          vision_signature_error_backoff_seconds: 30.0 # Backoff after transient Vision AI errors such as rate limits or 5xx responses.
          vision_signature_inflight_timeout_seconds: 60.0 # Clear a stuck Vision AI in-flight request after this many seconds.
          log_signature_vision_events: True # Append queue/skip decisions to debug_data/signature_training/signature_vision_events.jsonl.
          signature_vision_event_log_interval_seconds: 2.0 # Throttle repeated Vision event log lines with the same reason/hash.
          vision_signature_sample_known_reads: False # Also send locally known reads to Vision AI for extra training samples.
          vision_signature_accept_single_result: True # Treat one known Vision AI result as stable enough to show immediately.
          vision_signature_reject_overlay_artifacts: True # Skip Vision AI crops that contain red overlay/debug pixels.
          vision_signature_save_crops: True # Save sent number crops for later local recognizer training.
          vision_signature_training_dir: debug_data/signature_training # Relative to mining-data; stores crops and auto-label JSONL, including unknown but readable values.
          vision_signature_max_output_tokens: 512 # Response token limit for the small digit-only signature extraction prompt.
          local_signature_ocr_enabled: False # Disable local Tesseract OCR; Vision AI is the live recognition source and training label source.
          save_number_crops: False # Save OCR scan crops to mining-data/screenshots/signatures for debugging.
          overwrite_number_crop: True # If saving crops, overwrite latest_signature_number.png instead of creating timestamped files.
          log_observed_clusters: True # Appends stable observations to mining-data/debug_data/signature_cluster_observations.jsonl.
          minimum_signature_digits: 4 # Discards short OCR noise like 2 or 260.
          ocr_number_region_left_ratio: 0.35 # Ignores the left icon area before OCR.
          use_signature_icon_template: True # First look for the signature icon; skip OCR when it is not visible.
          signature_icon_template_path: templates/scans/scan_signature_icon.png # Template image used to find the signature row inside the watch area.
          signature_icon_match_threshold: 0.70 # Minimum template-match score required before OCR reads the number to the right.
          signature_icon_scales: [0.85, 1.0, 1.15] # Template scales to try so matching still works with small HUD size differences.
          signature_icon_tracking_enabled: True # Re-track the already found signature icon between OCR/Vision scans so overlays stay anchored.
          signature_icon_tracking_interval_seconds: 0.25 # How often the icon position is refreshed after the first match.
          signature_icon_tracking_search_padding_pixels: 48 # Pixels around the last icon position searched during fast tracking.
          signature_icon_tracking_miss_tolerance: 4 # Keep the last icon position through this many tracking misses before waiting for the next full scan.
          signature_number_crop_left_padding: 2 # Pixels between the detected icon's right edge and the OCR number crop.
          signature_number_crop_width: 120 # Fixed width in pixels for the signature number crop after the icon.
          signature_number_crop_min_width: 80 # Discard crops narrower than this instead of sending cut-off digits to Vision AI.
          signature_number_crop_right_padding: 36 # Pixels to leave unused at the right side of the watch area.
          signature_number_crop_vertical_padding: 8 # Extra pixels above and below the icon row kept for OCR context.
          debug_log_ocr_candidates: False # Logs OCR variant candidates; useful while tuning recognition.
          debug_log_ocr_timing: True # Logs whether OCR found digits and how long the simple OCR pass took.
          ocr_psm_modes: [7, 8, 13] # Only used when local_signature_ocr_enabled is True.
          ocr_variant_names: [gray, light_text, light_text_closed, light_text_thick, otsu, adaptive] # Only used when local_signature_ocr_enabled is True.
          ocr_tesseract_timeout_seconds: 2.0 # Only used when local_signature_ocr_enabled is True.
          ocr_fuzzy_reference_match: True # Correct unknown OCR values to a very close known reference value when the match is unambiguous.
          ocr_fuzzy_max_distance: 1 # Maximum Levenshtein digit edits allowed for fuzzy correction, e.g. 8460 -> 8480.
          ocr_fuzzy_max_weighted_distance: 0.5 # Maximum weighted OCR-confusion distance; favors likely digit confusions like 6 vs 8.
          ocr_fuzzy_max_numeric_delta: 100 # Maximum numeric difference allowed for fuzzy correction.
          ocr_fuzzy_require_same_length: True # Only fuzzy-match values with the same number of digits.
          ocr_fuzzy_allow_missing_leading_one: True # Allow correction like 1475 -> 11475 when adding a leading 1 gives an exact known signature.
          save_ocr_debug_variants: True # In debug mode, save latest OCR input variants to mining-data/debug_data/signature_ocr_variants.
          status_dot_size: 10 # Diameter in pixels of the blinking status dot left of the scan area.
          status_dot_offset_pixels: 16 # Horizontal distance from the scan area's left edge to the status dot center.
          status_dot_blink_ms: 450 # Blink interval for the status dot in milliseconds.
          status_dot_hold_ms: 900 # How long yellow/green/red stays before falling back to white without a fresh OCR result.
          dynamic_watch_area:
            enabled: True # Find a stable scan-angle HUD element first and derive the signature watch area from it.
            refresh_seconds: 10.0 # Re-check the scan-angle HUD position this often; cached coordinates are used between refreshes.
            missing_icon_refresh_after: 2 # If the signature icon is missing this many OCR ticks, refresh the dynamic watch area early.
            anchor_templates_glob: templates/scans/scan_area_*.jpg # Template images used to locate the stable scan-angle HUD element.
            anchor_match_threshold: 0.70 # Minimum template-match score required before the dynamic position is accepted.
            anchor_scales: [0.90, 1.0, 1.10] # Scale variants for matching the scan-angle HUD at slightly different HUD sizes.
            use_last_on_miss: True # If refresh fails, keep the last dynamic watch area instead of immediately falling back.
            anchor_search_area:
              # Absolute pixel search box relative to the Star Citizen window.
              # This limits scan_area*.jpg matching to the lower center HUD region instead of the whole screen.
              coords: [[850, 500], [1300, 950]]
            signature_area_offset:
              # Watch-area rectangle derived from the matched scan-angle template's top-left position.
              # Tune x/y until the red debug frame reliably contains the signature icon and number.
              x: 250
              y: -250
              width: 300
              height: 210
          watch_area:
            # Optional absolute pixel coordinates relative to the Star Citizen window screenshot.
            # Measure them in a full-size screenshot: [810, 280] means x=810 pixels from the left edge
            # and y=280 pixels from the top edge of the Star Citizen window/screenshot.
            # The two points are the top-left and bottom-right corners of the area to analyze.
            # If set, these override the ratio settings below.
            # coords: [[810, 280], [1110, 390]]
            center_x_ratio: 0.5
            center_y_ratio: 0.27
            width_ratio: 0.24
            height_ratio: 0.12
      TddManager: False # True | False - will activate the integration to UEX to be able to ask for trade routes and prices. Requires a UEX account and the UEX API key
      UexDataRunnerManager: False # True | False - will activate the UEX data runner capabilities. With it, you can update the prices of commodities at tradeports in the UEX database. Requires a UEX account with the UEX API key and the UEX user secret.
      DeliveryMissionManager: False # True | False - will activated the delivery mission manager. With it, you are able to make Cora manage your ingame delivery missions 
      NavigationManager:
        enabled: False # True | False - enables in-game starmap route automation via template matching and OCR validation.
        search_focus_wait_seconds: 0.60
        text_input_step_wait_seconds: 0.12
        route_key_wait_seconds: 0.25
        confirmation:
          function_prompt: If the function returns a confirmation_request because the score is too low, do not start navigation. Ask the user if they meant the suggested location and only call the function again after confirmation.
          request_reason: Best fuzzy candidate is below auto-match threshold.
          instructions_template: Do not execute navigation yet. Ask the user if they meant '{candidate_location_name}' in category '{candidate_location_category}'. If the user confirms, call navigate_to_location again using the suggested candidate_location_name and candidate_location_category exactly.
          no_match_instructions: Ask the user to repeat or clarify the destination name.
      LoreManager: True # True | False - Allows Cora to search the Galactepedia for lore information. 
      IssueCouncilManager: False # True | False - checks known bugs in the RSI Issue Council and analyzes duplicate relations
      MacroManager:
        enabled: True # Enables JSON based macro runtime (interval key steps, reminders, countdowns, beep ticker)
        debug_mode: False # logs manage_macro function args and parsed duration values for debugging
        default_play_beep: True # default macro execution beep
        min_interval_seconds: 1
        max_active_macros: 20
        default_afk_interval_seconds: 120 # default AFK macro interval (press Y every 120 seconds)
        data_directory: "macro-data" # relative to data-root-directory
        auto_activate_on_create: True
        reload_command_phrases:
          - makros neu laden
          - reload makros
        # Optional per-LLM-call overrides for MacroManager internal model calls.
        # If omitted, global features.conversation_provider + provider defaults are used.
        llm_calls:
          spoken_text_generation:
            provider: openai # available: openai, azure, groq
            model: gpt-4.1-mini # optional override for this call only
            max_tokens: 256 # optional override for this call only
            reasoning_effort: low # optional: low, medium, high
      AdvancedGenericLogManager: False
      manager_command_phrases:
